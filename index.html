<style>
:root {
  --bg: #0d1117; --text: #e8e0d4; --muted: rgba(232,224,212,0.45);
  --card: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.08);
  --accent: #7eb89a; --transition: 1.2s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;transition:background var(--transition);}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0;}
body::before{content:'';position:fixed;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg,transparent 5deg,rgba(126,184,154,0.008) 5deg,rgba(126,184,154,0.008) 5.5deg);animation:bgSpin 200s linear infinite;pointer-events:none;z-index:0;}
@keyframes bgSpin{to{transform:rotate(360deg);}}
.bg-layer{position:fixed;inset:0;z-index:0;transition:opacity var(--transition);pointer-events:none;}
.bg-default{background:radial-gradient(ellipse at 20% 50%,rgba(30,60,30,0.4) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(20,40,60,0.3) 0%,transparent 50%),linear-gradient(160deg,#0d1117 0%,#0a1a0e 50%,#0d1117 100%);opacity:1;}
.bg-active{opacity:0;}.bg-active.visible{opacity:1;}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.particle{position:absolute;border-radius:50%;animation:drift linear infinite;opacity:0;}
@keyframes drift{0%{transform:translateY(100vh) translateX(0) scale(0);opacity:0;}10%{opacity:1;}90%{opacity:0.6;}100%{transform:translateY(-20vh) translateX(var(--drift)) scale(1.5);opacity:0;}}
.bird-silhouette{position:fixed;z-index:0;pointer-events:none;opacity:0;transition:opacity 0.8s ease;animation:flyAcross linear infinite;}
.bird-silhouette.active{opacity:0.1;}
@keyframes flyAcross{0%{transform:translateX(-100px) translateY(0);}50%{transform:translateX(50vw) translateY(var(--flydip));}100%{transform:translateX(calc(100vw + 100px)) translateY(0);}}
.ripple-container{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.ripple{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,0.15);animation:rippleOut 3s ease-out forwards;transform:translate(-50%,-50%);}
@keyframes rippleOut{0%{width:0;height:0;opacity:0.8;}100%{width:600px;height:600px;opacity:0;}}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 24px 100px;}
/* Extra room at the bottom while a sound is playing, so the last cards are never hidden behind the facts panel + player bar */
body.has-player .wrap{padding-bottom:300px;}
header{text-align:center;padding:72px 0 56px;animation:fadeUp 0.8s ease both;}
.header-eyebrow{font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:6px;color:var(--muted);text-transform:uppercase;margin-bottom:16px;}
.header-title{font-family:'Cormorant Garamond',serif;font-size:clamp(52px,8vw,86px);font-weight:600;line-height:0.95;color:var(--text);letter-spacing:-1px;}
.header-title em{font-style:italic;color:var(--accent);}
.header-hindi{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(16px,3vw,22px);color:var(--muted);margin-top:10px;letter-spacing:2px;}
.header-divider{display:flex;align-items:center;justify-content:center;gap:16px;margin:24px 0 0;}
.hdline{flex:1;max-width:140px;height:1px;background:linear-gradient(90deg,transparent,rgba(126,184,154,0.3),transparent);}
.hddot{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0.5;}

/* --- Ambience toggle button + collapsible panel (rain / wind / water / bugs / instruments) --- */
.amb-toggle{position:fixed;top:20px;right:20px;z-index:102;display:flex;align-items:center;gap:8px;
  background:rgba(13,17,23,0.75);backdrop-filter:blur(14px);border:1px solid var(--border);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0.5px;padding:9px 14px;border-radius:999px;
  cursor:pointer;transition:all 0.25s ease;box-shadow:0 6px 20px rgba(0,0,0,0.3);}
.amb-toggle:hover{border-color:rgba(126,184,154,0.4);}
.amb-toggle:active{transform:scale(0.95);}
.amb-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.amb-toggle.has-active{border-color:var(--accent);color:var(--accent);}
.amb-badge{display:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#0d1117;font-size:10px;font-weight:500;line-height:18px;text-align:center;}
.ambience-panel{position:fixed;top:68px;right:20px;z-index:101;width:260px;background:rgba(13,17,23,0.92);
  backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:16px;
  padding:14px 16px 16px;display:none;flex-direction:column;gap:10px;
  box-shadow:0 8px 30px rgba(0,0,0,0.35);}
.ambience-panel.open{display:flex;animation:fadeUp 0.25s ease both;}
.amb-stopall{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:transparent;border:1px solid var(--border);color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:9px 12px;border-radius:12px;cursor:pointer;transition:all 0.25s ease;}
.amb-stopall:hover:not(:disabled){border-color:rgba(126,184,154,0.4);color:var(--accent);}
.amb-stopall:active:not(:disabled){transform:scale(0.96);}
.amb-stopall:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.amb-stopall:disabled{opacity:0.4;cursor:default;}
.ambience-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:6px;}
.ambience-label::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0.6;}
.ambience-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.panel-section{display:flex;flex-direction:column;gap:10px;}
.panel-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border) 20%,var(--border) 80%,transparent);margin:1px 0;}
.ambience-btn{display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.5px;padding:9px 12px;
  border-radius:12px;cursor:pointer;transition:all 0.25s ease;white-space:nowrap;}
.ambience-btn:hover{border-color:rgba(126,184,154,0.35);color:var(--text);background:rgba(255,255,255,0.06);}
.ambience-btn:active{transform:scale(0.94);}
.ambience-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.ambience-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(126,184,154,0.12);
  box-shadow:0 0 16px rgba(126,184,154,0.15);}
.ambience-btn .amb-icon{font-size:14px;line-height:1;}
.ambience-btn.active .amb-icon{animation:ambPulse 1.8s ease-in-out infinite;}
@keyframes ambPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
@media(max-width:600px){
  /* On phones the button and panel scroll away with the page instead of hovering over the content */
  .amb-toggle{position:absolute;top:14px;right:12px;}
  .ambience-panel{position:absolute;top:60px;left:12px;right:12px;width:auto;padding:12px 14px 14px;border-radius:14px;gap:10px;}
  .panel-section{gap:6px;}
  .ambience-buttons{grid-template-columns:repeat(4,1fr);gap:6px;}
  .ambience-btn{flex-direction:column;padding:8px 4px;font-size:9px;gap:3px;}
  .ambience-btn .amb-icon{font-size:16px;}
}

.now-playing{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,15,10,0.94);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px;transform:translateY(100%);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);}
.now-playing.visible{transform:translateY(0);}
.np-wave{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.np-bar{width:3px;background:var(--accent);border-radius:2px;animation:waveBar 0.8s ease-in-out infinite alternate;}
.np-bar:nth-child(1){height:14px;animation-delay:0s;}.np-bar:nth-child(2){height:20px;animation-delay:0.15s;}.np-bar:nth-child(3){height:10px;animation-delay:0.3s;}.np-bar:nth-child(4){height:18px;animation-delay:0.1s;}.np-bar:nth-child(5){height:12px;animation-delay:0.25s;}
@keyframes waveBar{from{transform:scaleY(0.4);}to{transform:scaleY(1);}}
.np-info{flex:1;min-width:0;}.np-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--text);line-height:1;}.np-sub{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:2px;}
.np-stop{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;cursor:pointer;transition:all 0.2s;flex-shrink:0;}
.np-stop:hover{border-color:rgba(126,184,154,0.4);color:var(--accent);}
.np-stop:active{transform:scale(0.95);}
.np-stop:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.np-loop{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:8px 14px;cursor:pointer;transition:all 0.2s;flex-shrink:0;display:flex;align-items:center;gap:6px;}
.np-loop:hover{border-color:rgba(126,184,154,0.4);color:var(--text);}
.np-loop:active{transform:scale(0.95);}
.np-loop:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.np-loop.active{border-color:var(--accent);color:var(--accent);background:rgba(126,184,154,0.12);box-shadow:0 0 16px rgba(126,184,154,0.15);}
.np-loop .loop-icon{width:16px;height:16px;flex-shrink:0;display:block;}
@media(max-width:600px){.np-loop{padding:8px 10px;}}

/* --- Featured "Did you know" panel: now floats above the player bar, so it never pushes the cards down --- */
.featured-panel{display:none;position:fixed;left:12px;right:12px;bottom:72px;max-width:1076px;margin:0 auto;z-index:99;max-height:42vh;overflow-y:auto;}
.featured-panel.visible{display:flex;animation:featuredIn 0.45s cubic-bezier(0.4,0,0.2,1) both;}
@keyframes featuredIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.featured-inner{position:relative;display:flex;width:100%;border:1px solid rgba(126,184,154,0.35);border-top:3px solid var(--accent);
  background:linear-gradient(rgba(126,184,154,0.06),rgba(126,184,154,0.06)),rgba(10,15,10,0.97);
  backdrop-filter:blur(16px);overflow:hidden;box-shadow:0 -8px 30px rgba(0,0,0,0.4);}
.featured-close{position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--border);color:var(--muted);font-size:14px;line-height:1;cursor:pointer;border-radius:50%;transition:all 0.2s;}
.featured-close:hover{border-color:rgba(126,184,154,0.4);color:var(--accent);}
.featured-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.featured-left{flex-shrink:0;width:170px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 16px;border-right:1px solid var(--border);background:rgba(0,0,0,0.2);}
.featured-photo-wrap{width:64px;height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 0 24px rgba(126,184,154,0.5));animation:birdFloat 3s ease-in-out infinite;}
@keyframes birdFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.featured-photo{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid rgba(126,184,154,0.4);}
.featured-icon-img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 4px 20px rgba(0,0,0,0.4));}
.featured-emoji-fallback{font-size:50px;line-height:1;text-align:center;}
.featured-bird-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--accent);margin-top:10px;text-align:center;line-height:1.3;max-width:100%;}
.featured-bird-hindi{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:var(--muted);margin-top:3px;text-align:center;max-width:100%;line-height:1.4;}
.featured-habitat{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(126,184,154,0.4);margin-top:7px;}
.featured-right{flex:1;padding:18px 46px 16px 22px;display:flex;flex-direction:column;justify-content:center;gap:8px;}
.featured-label{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:rgba(126,184,154,0.4);}
.featured-fact{font-family:'Cormorant Garamond',serif;font-size:clamp(15px,2vw,19px);line-height:1.6;color:rgba(232,224,212,0.8);font-style:italic;}
.featured-scientific{font-size:11px;color:rgba(232,224,212,0.55);letter-spacing:1px;font-style:italic;}
.grid-label{font-size:11px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-bottom:20px;animation:fadeUp 0.8s 0.1s ease both;}
.search-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;animation:fadeUp 0.8s 0.15s ease both;}
.bird-search{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:14px;padding:12px 16px;border-radius:10px;outline:none;
  transition:border-color 0.25s ease,background 0.25s ease;}
.bird-search::placeholder{color:var(--muted);}
.bird-search:focus{border-color:rgba(126,184,154,0.5);background:rgba(255,255,255,0.06);}
.search-count{font-size:11px;color:var(--muted);letter-spacing:0.5px;white-space:nowrap;flex-shrink:0;}
.share-btn{flex-shrink:0;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all 0.2s;border-radius:2px;}
.share-btn:hover{border-color:rgba(126,184,154,0.4);color:var(--accent);background:rgba(255,255,255,0.06);}
.share-btn:active{transform:scale(0.92);}
.share-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.no-results{text-align:center;padding:60px 20px;color:var(--muted);font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:18px;}
.birds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px;animation:fadeUp 0.8s 0.2s ease both;}
.bird-card{background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all 0.3s ease;position:relative;overflow:hidden;aspect-ratio:4/3;display:flex;flex-direction:column;justify-content:flex-end;}
.bird-card::before{content:'';position:absolute;inset:0;background:var(--card-bg,linear-gradient(135deg,#1a2a1a,#0d1a0d));transition:transform 0.6s cubic-bezier(0.4,0,0.2,1);z-index:0;}
.bird-card:hover{border-color:rgba(255,255,255,0.15);transform:translateY(-2px);}.bird-card:hover::before{transform:scale(1.05);}
.bird-card:active{transform:translateY(0) scale(0.97);}
.bird-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.bird-card.playing{border-color:var(--accent);box-shadow:0 0 30px rgba(126,184,154,0.2),inset 0 0 30px rgba(126,184,154,0.05);}
.bird-card.loading-sound{border-color:rgba(126,184,154,0.4);}
.bird-photo-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;transition:transform 0.4s ease;}
.bird-card:hover .bird-photo-wrap{transform:scale(1.1) translateY(-4px);}
.bird-card.playing .bird-photo-wrap{animation:birdBob 1s ease-in-out infinite;}
@keyframes birdBob{0%,100%{transform:translateY(0) scale(1.1);}50%{transform:translateY(-8px) scale(1.15);}}
.bird-photo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.18);
  box-shadow:0 4px 20px rgba(0,0,0,0.5);}
.bird-card.playing .bird-photo{border-color:var(--accent);box-shadow:0 0 20px rgba(126,184,154,0.4);}
.bird-icon-img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 4px 20px rgba(0,0,0,0.5));}
.bird-card.playing .bird-icon-img{filter:drop-shadow(0 0 20px rgba(126,184,154,0.55));}
.bird-emoji-fallback{font-size:60px;filter:drop-shadow(0 4px 20px rgba(0,0,0,0.5));line-height:1;}
.card-tags{position:absolute;top:12px;left:12px;right:12px;z-index:2;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none;}
.habitat-tag{margin-left:auto;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.5);background:rgba(0,0,0,0.3);padding:4px 8px;border:1px solid rgba(255,255,255,0.1);}
.multi-sound-tag{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);background:rgba(126,184,154,0.15);padding:4px 8px;border:1px solid rgba(126,184,154,0.3);border-radius:10px;}
.bird-info{position:relative;z-index:2;padding:16px 20px 18px;background:linear-gradient(transparent,rgba(0,0,0,0.7) 40%,rgba(0,0,0,0.9));}
.bird-common{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--text);line-height:1;}
.bird-hindi{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:rgba(255,255,255,0.5);margin-top:2px;}
.bird-scientific{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.5);margin-top:4px;font-style:italic;}
.play-indicator{display:flex;align-items:center;gap:6px;margin-top:10px;opacity:0;transform:translateY(4px);transition:all 0.2s ease;}
.bird-card:hover .play-indicator,.bird-card.playing .play-indicator,.bird-card.loading-sound .play-indicator{opacity:1;transform:translateY(0);}
.play-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.bird-card.playing .play-dot{animation:pulseDot 1s ease infinite;}
.bird-card.loading-sound .play-dot{animation:pulseDot 0.4s ease infinite;background:rgba(126,184,154,0.6);}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.4);opacity:0.6;}}
.play-text{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}

/* --- Toast notifications (replaces blocking alert()) --- */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:200;
  background:rgba(20,15,10,0.95);backdrop-filter:blur(14px);border:1px solid rgba(255,120,120,0.3);
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:12px 20px;border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);opacity:0;pointer-events:none;transition:all 0.3s ease;max-width:90vw;text-align:center;}
.toast.visible{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:600px){.toast{top:auto;bottom:90px;font-size:12px;padding:10px 16px;}}
footer{margin-top:60px;text-align:center;padding-top:30px;border-top:1px solid var(--border);animation:fadeUp 0.8s 0.4s ease both;}
.footer-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:rgba(232,224,212,0.6);letter-spacing:1px;}
.footer-credit{margin-top:16px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.footer-credit a{color:var(--accent);text-decoration:none;font-weight:500;border-bottom:1px solid rgba(126,184,154,0.35);padding-bottom:1px;transition:border-color 0.2s,color 0.2s;}
.footer-credit a:hover{border-color:var(--accent);color:var(--text);}

// Ambience sounds need these files added to the assets folder:
//   assets/rain.mp3, assets/wind.mp3, assets/water.mp3, assets/bugs.mp3

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('visible');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 3500);
}

function shareSite() {
  const shareData = {
    title: 'Pakshi — Indian Bird Sound Library',
   text: "Explore India's birds 🦚 — tap any bird to hear its real call, learn its Hindi name, and discover fun facts. Made for curious kids and nature lovers.",
    url: window.location.href
  };
  if (navigator.share) {
    navigator.share(shareData).catch((err) => {
      if (err && err.name === 'AbortError') return; // user cancelled the share sheet — no feedback needed
      copyLinkFallback(shareData.url);
    });
  } else {
    copyLinkFallback(shareData.url);
  }
}

function copyLinkFallback(url) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(() => showToast('Link copied — go share it!'))
      .catch(() => showToast(url));
  } else {
    showToast(url);
  }
}

function renderAmbience() {
  SOUND_GROUPS.forEach(group => {
    document.getElementById(group.containerId).innerHTML = group.sounds.map(a => `
      <button type="button" class="ambience-btn" id="amb-btn-${a.id}" onclick="toggleAmbient('${a.id}')" aria-label="Toggle ${a.label}" aria-pressed="false">
        <span class="amb-icon">${a.icon}</span><span>${a.label}</span>
      </button>`).join('');
  });
}

// --- Ambience panel open/close ---
function setAmbPanel(open) {
  const panel = document.getElementById('ambPanel');
  const toggle = document.getElementById('ambToggle');
  panel.classList.toggle('open', open);
  toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  document.body.classList.toggle('amb-open', open);
}
function toggleAmbPanel() {
  setAmbPanel(!document.getElementById('ambPanel').classList.contains('open'));
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const panel = document.getElementById('ambPanel');
  if (!panel.classList.contains('open')) return;
  const focusWasInside = panel.contains(document.activeElement);
  setAmbPanel(false);
  if (focusWasInside) document.getElementById('ambToggle').focus();
});

// Shows how many ambience/instrument sounds are on, so people know something is playing even when the panel is closed
function updateAmbBadge() {
  const count = Object.keys(ambientOn).filter(k => ambientOn[k]).length;
  const badge = document.getElementById('ambBadge');
  badge.textContent = count;
  badge.style.display = count > 0 ? 'inline-block' : 'none';
  document.getElementById('ambToggle').classList.toggle('has-active', count > 0);
  document.getElementById('ambStopAll').disabled = count === 0;
}

// Turns off every ambience and instrument sound at once (bird sounds are not affected)
function stopAllAmbient() {
  ALL_SOUNDS.forEach(a => { if (ambientOn[a.id]) toggleAmbient(a.id); });
  document.getElementById('ambToggle').focus(); // the button just became disabled, so keep keyboard focus somewhere sensible
}

function setAmbientButton(id, on) {
  const btn = document.getElementById('amb-btn-' + id);
  if (!btn) return;
  btn.classList.toggle('active', on);
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
}

function toggleAmbient(id) {
  const conf = ALL_SOUNDS.find(a => a.id === id);
  if (!conf) return;
  const isOn = !!ambientOn[id];

  if (!isOn) {
    if (!ambientAudios[id]) {
      const audio = new Audio(conf.file);
      audio.loop = true;
      audio.volume = 0;
      audio.addEventListener('error', () => {
        showToast("Sorry, " + conf.label + " sound couldn't be loaded. Make sure " + conf.file + " exists.");
        audio.pause();
        delete ambientAudios[id];
        ambientOn[id] = false;
        setAmbientButton(id, false);
        updateAmbBadge();
      });
      ambientAudios[id] = audio;
    }
    const audio = ambientAudios[id];
    const p = audio.play();
    if (p && p.catch) {
      p.catch((err) => {
        // File problems are handled by the 'error' listener above. A blocked play (rare, since this runs from a tap) is undone here.
        if (err && err.name === 'NotAllowedError') {
          ambientOn[id] = false;
          setAmbientButton(id, false);
          updateAmbBadge();
          showToast('Your browser blocked the sound. Tap ' + conf.label + ' again.');
        }
      });
    }
    fadeAudio(audio, audio.volume, conf.volume, 800);
    ambientOn[id] = true;
    setAmbientButton(id, true);
  } else {
    const audio = ambientAudios[id];
    if (audio) fadeAudio(audio, audio.volume, 0, 600, () => audio.pause());
    ambientOn[id] = false;
    setAmbientButton(id, false);
  }
  updateAmbBadge();
}

function fadeAudio(audio, from, to, duration, onDone) {
  if (audio._fadeInterval) clearInterval(audio._fadeInterval);
  const steps = 20;
  const stepTime = duration / steps;
  let i = 0;
  audio._fadeInterval = setInterval(() => {
    i++;
    audio.volume = Math.max(0, Math.min(1, from + (to - from) * (i / steps)));
    if (i >= steps) {
      clearInterval(audio._fadeInterval);
      audio._fadeInterval = null;
      if (onDone) onDone();
    }
  }, stepTime);
}

function defaultPlayText(bird) {
  return bird.sounds ? 'Tap for ' + bird.sounds[0].label : 'Tap to play';
}

function resetAllPlayTexts() {
  BIRDS.forEach(b => {
    const el = document.getElementById('playtxt-' + b.id);
    if (el) el.textContent = defaultPlayText(b);
  });
}

// Puts the current playing/loading look back on the right card. Called after every state change
// AND after every grid redraw (e.g. while searching), so the playing highlight is never lost.
function applyCardState() {
  document.querySelectorAll('.bird-card').forEach(c => c.classList.remove('playing', 'loading-sound'));
  resetAllPlayTexts();
  if (!currentBirdId || playState === 'idle') return;
  const card = document.getElementById('card-' + currentBirdId);
  if (!card) return; // the playing bird is hidden by the current search — nothing to highlight
  card.classList.add(playState === 'playing' ? 'playing' : 'loading-sound');
  const txt = document.getElementById('playtxt-' + currentBirdId);
  if (txt) txt.textContent = playLabel;
}

function renderGrid(list) {
  const birds = list || BIRDS;
  const grid = document.getElementById('birdsGrid');
  const noResults = document.getElementById('noResults');

  if (birds.length === 0) {
    grid.innerHTML = '';
    grid.style.display = 'none';
    noResults.style.display = 'block';
    return;
  }
  grid.style.display = 'grid';
  noResults.style.display = 'none';

  grid.innerHTML = birds.map(b => `
    <div class="bird-card" id="card-${b.id}" onclick="playBird('${b.id}')"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();playBird('${b.id}');}"
         tabindex="0" role="button" aria-label="${b.sounds ? 'Play ' + b.common + ', tap again to cycle through ' + b.sounds.length + ' sounds' : 'Play ' + b.common + ' call'}"
         style="--card-bg:${b.cardBg}">
      <div class="card-tags">
        ${b.sounds ? `<div class="multi-sound-tag">${b.sounds.length} sounds</div>` : ''}
        <div class="habitat-tag">${b.habitat}</div>
      </div>
      <div class="bird-photo-wrap">
        <img class="bird-icon-img" src="assets/icons/${b.id}.png" alt="" loading="lazy"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='';" />
        <div class="bird-emoji-fallback" style="display:none">${b.emoji}</div>
      </div>
      <div class="bird-info">
        <div class="bird-common">${b.common}</div>
        <div class="bird-hindi">${b.hindi}</div>
        <div class="bird-scientific">${b.scientific}</div>
        <div class="play-indicator">
          <div class="play-dot"></div>
          <div class="play-text" id="playtxt-${b.id}">${defaultPlayText(b)}</div>
        </div>
      </div>
    </div>`).join('');

  applyCardState();
}

function filterBirds(query) {
  const q = query.trim().toLowerCase();
  const countEl = document.getElementById('searchCount');
  if (!q) {
    countEl.textContent = '';
    renderGrid(BIRDS);
    return;
  }
  const filtered = BIRDS.filter(b =>
    b.common.toLowerCase().includes(q) ||
    b.hindi.toLowerCase().includes(q) ||
    b.scientific.toLowerCase().includes(q) ||
    b.habitat.toLowerCase().includes(q)
  );
  countEl.textContent = filtered.length + (filtered.length === 1 ? ' bird' : ' birds');
  renderGrid(filtered);
}

function toggleLoop() {
  loopOn = !loopOn;
  const btn = document.getElementById('npLoopBtn');
  btn.classList.toggle('active', loopOn);
  btn.setAttribute('aria-pressed', loopOn ? 'true' : 'false');
  if (currentAudio) currentAudio.loop = loopOn;
}

function getSoundList(bird) {
  return bird.sounds || [{ label: null, file: bird.sound }];
}

function playBird(id) {
  const bird = BIRDS.find(b => b.id === id);
  if (!bird) return;
  const soundList = getSoundList(bird);

  if (currentBirdId === id) {
    if (soundList.length > 1) {
      currentSoundIndex = (currentSoundIndex + 1) % soundList.length;
      playSoundForBird(bird, soundList, currentSoundIndex);
      return;
    }
    stopAll();
    return;
  }

  currentSoundIndex = 0;
  playSoundForBird(bird, soundList, currentSoundIndex);
}

function playSoundForBird(bird, soundList, index) {
  const id = bird.id;
  const entry = soundList[index];

  // 1) Silence whatever was playing/loading RIGHT NOW (not later), so two sounds can never overlap.
  if (currentAudio) {
    const old = currentAudio;
    currentAudio = null;
    old.pause();
    try { old.currentTime = 0; } catch (e) {}
  }

  // 2) Update the screen straight away.
  currentBirdId = id;
  currentSoundIndex = index;
  playState = 'loading';
  playLabel = 'Loading...';
  applyCardState();

  document.getElementById('npName').textContent = bird.common;
  document.getElementById('npSub').textContent = bird.hindi + ' · ' + bird.habitat + (entry.label ? ' · ' + entry.label : '');
  document.getElementById('nowPlaying').classList.add('visible');
  document.body.classList.add('has-player');

  showFeatured(bird);
  updateBackground(bird);
  const card = document.getElementById('card-' + id);
  if (card) spawnRipple(card);
  document.querySelectorAll('.bird-silhouette').forEach(s => s.classList.add('active'));

  // 3) Start the sound inside the tap itself. iPhones/Safari only allow sound that starts directly from a tap,
  //    so we call play() right now and don't wait for the file to finish loading first.
  const audio = new Audio(entry.file);
  audio.loop = loopOn;
  currentAudio = audio;
  const isCurrent = () => currentAudio === audio;

  audio.addEventListener('playing', () => {
    if (!isCurrent()) return;
    playState = 'playing';
    playLabel = entry.label
      ? '▸ ' + entry.label + (soundList.length > 1 ? ' · tap for next' : '')
      : 'Now playing...';
    applyCardState();
  }, { once: true });

  audio.addEventListener('ended', () => {
    if (isCurrent()) stopAll();
  });

  audio.addEventListener('error', () => {
    if (!isCurrent()) return;
    stopAll();
    showToast("Sorry, sound failed to load for " + bird.common + (entry.label ? ' (' + entry.label + ')' : ''));
  });

  const p = audio.play();
  if (p && p.catch) {
    p.catch((err) => {
      if (!isCurrent()) return;               // an older tap — ignore
      if (err && err.name === 'AbortError') return;
      stopAll();
      if (err && err.name === 'NotAllowedError') {
        showToast('Your browser blocked the sound. Tap the bird again.');
      } else {
        showToast("Sorry, sound failed to load for " + bird.common + (entry.label ? ' (' + entry.label + ')' : ''));
      }
    });
  }
}

function stopAll() {
  // Note: this intentionally does NOT touch ambientAudios — ambience sounds keep playing.
  if (currentAudio) {
    const a = currentAudio;
    currentAudio = null;   // set first, so any late events from this audio are ignored
    a.pause();
    try { a.currentTime = 0; } catch (e) {}
  }
  currentBirdId = null;
  playState = 'idle';
  playLabel = '';
  applyCardState();
  document.getElementById('nowPlaying').classList.remove('visible');
  document.getElementById('featuredPanel').classList.remove('visible');
  document.body.classList.remove('has-player');
  document.querySelectorAll('.bird-silhouette').forEach(s => s.classList.remove('active'));
  document.getElementById('bgActive').style.opacity = '0';
  document.getElementById('particles').innerHTML = '';
}

function updateBackground(bird) {
  const bg = document.getElementById('bgActive');
  bg.style.background = `${bird.bg},radial-gradient(ellipse at 30% 40%, ${bird.bgGlow} 0%,transparent 55%)`;
  bg.style.opacity = '1';
  spawnParticles(bird.particleColor);
}

function spawnParticles(color) {
  const c = document.getElementById('particles');
  c.innerHTML = '';
  if (reduceMotion) return;
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const s = Math.random()*4+2;
    p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${color};--drift:${(Math.random()-0.5)*200}px;animation-duration:${Math.random()*8+6}s;animation-delay:${Math.random()*4}s;`;
    c.appendChild(p);
  }
}

function spawnRipple(card) {
  if (reduceMotion || !card) return;
  const c = document.getElementById('rippleContainer');
  const r = card.getBoundingClientRect();
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'ripple';
      el.style.left = (r.left + r.width/2) + 'px';
      el.style.top = (r.top + r.height/2) + 'px';
      el.style.animationDelay = (i*0.4)+'s';
      c.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }, i*300);
  }
}

function hideFeatured() {
  document.getElementById('featuredPanel').classList.remove('visible');
}

function showFeatured(bird) {
  const panel = document.getElementById('featuredPanel');
  panel.classList.remove('visible');
  setTimeout(() => {
    // If the sound was stopped, or another bird was tapped, during this tiny delay, don't show a stale panel
    if (currentBirdId !== bird.id) return;

    const fallback = document.getElementById('featuredEmojiFallback');
    fallback.textContent = bird.emoji;
    fallback.style.display = 'none';

    const iconImg = document.getElementById('featuredIconImg');
    iconImg.style.display = '';
    iconImg.src = 'assets/icons/' + bird.id + '.png';

    document.getElementById('featuredName').textContent = bird.common;
    document.getElementById('featuredHindi').textContent = bird.hindi;
    document.getElementById('featuredHabitat').textContent = bird.habitat;
    document.getElementById('featuredFact').textContent = bird.fact;
    document.getElementById('featuredScientific').textContent = bird.scientific;

    // Sit exactly on top of the player bar, whatever height it has on this screen
    const barHeight = document.getElementById('nowPlaying').offsetHeight || 72;
    panel.style.bottom = (barHeight + 8) + 'px';
    panel.classList.add('visible');
  }, 80);
}

renderGrid();
renderAmbience();
</script>
</body>
</html>
