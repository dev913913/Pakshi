<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pakshi — Indian Bird Sound Library</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg: #0d1117;
  --text: #e8e0d4;
  --muted: rgba(232,224,212,0.45);
  --card: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --accent: #7eb89a;
  --transition: 1.2s cubic-bezier(0.4,0,0.2,1);
}

*,*::before,*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  transition:background var(--transition);
}

body::before{
  content:'';
  position:fixed;
  inset:-50%;
  background:repeating-conic-gradient(
    from 0deg at 50% 50%,
    transparent 0deg,
    transparent 5deg,
    rgba(126,184,154,0.008) 5deg,
    rgba(126,184,154,0.008) 5.5deg
  );
  animation:bgSpin 200s linear infinite;
  pointer-events:none;
  z-index:0;
}

@keyframes bgSpin{
  to{transform:rotate(360deg);}
}

.bg-layer{
  position:fixed;
  inset:0;
  z-index:0;
  transition:opacity var(--transition);
  pointer-events:none;
}

.bg-default{
  background:
    radial-gradient(
      ellipse at 20% 50%,
      rgba(30,60,30,0.4) 0%,
      transparent 60%
    ),
    radial-gradient(
      ellipse at 80% 20%,
      rgba(20,40,60,0.3) 0%,
      transparent 50%
    ),
    linear-gradient(
      160deg,
      #0d1117 0%,
      #0a1a0e 50%,
      #0d1117 100%
    );
  opacity:1;
}

.bg-active{
  opacity:0;
}

.bg-active.visible{
  opacity:1;
}

/* ---------------------------
   Particles
--------------------------- */

.particles{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}

.particle{
  position:absolute;
  border-radius:50%;
  animation:drift linear infinite;
  opacity:0;
}

@keyframes drift{
  0%{
    transform:
      translateY(100vh)
      translateX(0)
      scale(0);
    opacity:0;
  }

  10%{
    opacity:1;
  }

  90%{
    opacity:0.6;
  }

  100%{
    transform:
      translateY(-20vh)
      translateX(var(--drift))
      scale(1.5);
    opacity:0;
  }
}

/* ---------------------------
   Flying birds
--------------------------- */

.bird-silhouette{
  position:fixed;
  z-index:0;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.8s ease;
  animation:flyAcross linear infinite;
}

.bird-silhouette.active{
  opacity:0.1;
}

@keyframes flyAcross{
  0%{
    transform:
      translateX(-100px)
      translateY(0);
  }

  50%{
    transform:
      translateX(50vw)
      translateY(var(--flydip));
  }

  100%{
    transform:
      translateX(calc(100vw + 100px))
      translateY(0);
  }
}

/* ---------------------------
   Ripples
--------------------------- */

.ripple-container{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}

.ripple{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.15);
  animation:rippleOut 3s ease-out forwards;
  transform:translate(-50%,-50%);
}

@keyframes rippleOut{
  0%{
    width:0;
    height:0;
    opacity:0.8;
  }

  100%{
    width:600px;
    height:600px;
    opacity:0;
  }
}

/* ---------------------------
   Main wrapper
--------------------------- */

.wrap{
  position:relative;
  z-index:1;
  max-width:1100px;
  margin:0 auto;
  padding:0 24px 100px;
}

/* ---------------------------
   Header
--------------------------- */

header{
  text-align:center;
  padding:72px 0 56px;
  animation:fadeUp 0.8s ease both;
}

.header-eyebrow{
  font-family:'DM Sans',sans-serif;
  font-size:11px;
  letter-spacing:6px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:16px;
}

.header-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(52px,8vw,86px);
  font-weight:600;
  line-height:0.95;
  color:var(--text);
  letter-spacing:-1px;
}

.header-title em{
  font-style:italic;
  color:var(--accent);
}

.header-hindi{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(16px,3vw,22px);
  color:var(--muted);
  margin-top:10px;
  letter-spacing:2px;
}

.header-divider{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  margin:24px 0 0;
}

.hdline{
  flex:1;
  max-width:140px;
  height:1px;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(126,184,154,0.3),
      transparent
    );
}

.hddot{
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--accent);
  opacity:0.5;
}

/* ---------------------------
   Ambience panel
--------------------------- */

.ambience-panel{
  position:fixed;
  top:20px;
  right:20px;
  z-index:101;
  background:rgba(13,17,23,0.75);
  backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px 16px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  box-shadow:0 8px 30px rgba(0,0,0,0.35);
}

.ambience-label{
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:6px;
}

.ambience-label::before{
  content:'';
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--accent);
  opacity:0.6;
}

.ambience-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.panel-section{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.panel-divider{
  height:1px;
  background:
    linear-gradient(
      90deg,
      transparent,
      var(--border) 20%,
      var(--border) 80%,
      transparent
    );
  margin:1px 0;
}

.ambience-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  color:var(--muted);
  font-family:'DM Sans',sans-serif;
  font-size:11px;
  letter-spacing:0.5px;
  padding:9px 12px;
  border-radius:12px;
  cursor:pointer;
  transition:all 0.25s ease;
  white-space:nowrap;
}

.ambience-btn:hover{
  border-color:rgba(126,184,154,0.35);
  color:var(--text);
  background:rgba(255,255,255,0.06);
}

.ambience-btn.active{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(126,184,154,0.12);
  box-shadow:0 0 16px rgba(126,184,154,0.15);
}

.ambience-btn .amb-icon{
  font-size:14px;
  line-height:1;
}

.ambience-btn.active .amb-icon{
  animation:ambPulse 1.8s ease-in-out infinite;
}

@keyframes ambPulse{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.15);
  }
}

/* ---------------------------
   Now playing
--------------------------- */

.now-playing{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:100;
  background:rgba(10,15,10,0.94);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:14px 28px;
  display:flex;
  align-items:center;
  gap:16px;
  transform:translateY(100%);
  transition:
    transform 0.4s cubic-bezier(0.4,0,0.2,1);
}

.now-playing.visible{
  transform:translateY(0);
}

.np-wave{
  display:flex;
  align-items:center;
  gap:3px;
  flex-shrink:0;
}

.np-bar{
  width:3px;
  background:var(--accent);
  border-radius:2px;
  animation:waveBar 0.8s ease-in-out infinite alternate;
}

.np-bar:nth-child(1){
  height:14px;
  animation-delay:0s;
}

.np-bar:nth-child(2){
  height:20px;
  animation-delay:0.15s;
}

.np-bar:nth-child(3){
  height:10px;
  animation-delay:0.3s;
}

.np-bar:nth-child(4){
  height:18px;
  animation-delay:0.1s;
}

.np-bar:nth-child(5){
  height:12px;
  animation-delay:0.25s;
}

@keyframes waveBar{
  from{
    transform:scaleY(0.4);
  }

  to{
    transform:scaleY(1);
  }
}

.np-info{
  flex:1;
}

.np-name{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;
  font-weight:600;
  color:var(--text);
  line-height:1;
}

.np-sub{
  font-size:11px;
  color:var(--muted);
  letter-spacing:1px;
  margin-top:2px;
}

.np-stop{
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  font-family:'DM Sans',sans-serif;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  padding:8px 16px;
  cursor:pointer;
  transition:all 0.2s;
  flex-shrink:0;
}

.np-stop:hover{
  border-color:rgba(126,184,154,0.4);
  color:var(--accent);
}

/* ---------------------------
   Featured panel
--------------------------- */

.featured-panel{
  display:none;
  margin-bottom:3px;
  overflow:hidden;
}

.featured-panel.visible{
  display:flex;
  animation:
    featuredIn 0.45s cubic-bezier(0.4,0,0.2,1) both;
}

@keyframes featuredIn{
  from{
    opacity:0;
    transform:translateY(-12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.featured-inner{
  display:flex;
  width:100%;
  border:1px solid rgba(126,184,154,0.35);
  border-top:3px solid var(--accent);
  background:rgba(126,184,154,0.04);
  overflow:hidden;
}

.featured-left{
  flex-shrink:0;
  width:200px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px 20px;
  border-right:1px solid var(--border);
  background:rgba(0,0,0,0.2);
}

.featured-photo-wrap{
  width:84px;
  height:84px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  filter:
    drop-shadow(
      0 0 24px
      rgba(126,184,154,0.5)
    );
  animation:birdFloat 3s ease-in-out infinite;
}

@keyframes birdFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }
}

.featured-photo{
  width:84px;
  height:84px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(126,184,154,0.4);
}

.featured-emoji-fallback{
  font-size:66px;
  line-height:1;
  text-align:center;
}

.featured-bird-name{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;
  font-weight:600;
  color:var(--accent);
  margin-top:12px;
  text-align:center;
  line-height:1.4;
  max-width:100%;
}

.featured-bird-hindi{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
  text-align:center;
  max-width:100%;
  line-height:1.4;
}

.featured-habitat{
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(126,184,154,0.4);
  margin-top:7px;
}

.featured-right{
  flex:1;
  padding:28px 28px 24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:10px;
}

.featured-label{
  font-size:9px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(126,184,154,0.4);
}

.featured-fact{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(15px,2vw,19px);
  line-height:1.7;
  color:rgba(232,224,212,0.8);
  font-style:italic;
}

.featured-scientific{
  font-size:11px;
  color:rgba(232,224,212,0.2);
  letter-spacing:1px;
  font-style:italic;
}

/* ---------------------------
   Talking Tota
--------------------------- */

.tota-talk-area{
  display:none;
  width:100%;
  margin-top:12px;
  animation:fadeUp 0.35s ease both;
}

.tota-talk-area.visible{
  display:block;
}

.tota-talk-btn{
  width:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px 12px;
  border:1px solid rgba(0,200,83,0.45);
  background:rgba(0,200,83,0.08);
  color:#7ee2a8;
  font-family:'DM Sans',sans-serif;
  font-size:10px;
  letter-spacing:1.2px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.25s ease;
  border-radius:10px;
}

.tota-talk-btn:hover{
  background:rgba(0,200,83,0.16);
  border-color:#00c853;
  box-shadow:0 0 20px rgba(0,200,83,0.15);
}

.tota-talk-btn.listening{
  background:rgba(0,200,83,0.18);
  border-color:#00c853;
  color:#8ff0b5;
  animation:totaListening 1.2s ease-in-out infinite;
}

@keyframes totaListening{
  0%,100%{
    box-shadow:0 0 0 rgba(0,200,83,0);
  }

  50%{
    box-shadow:0 0 22px rgba(0,200,83,0.3);
  }
}

.tota-talk-status{
  font-size:9px;
  line-height:1.4;
  color:var(--muted);
  margin-top:7px;
  min-height:26px;
  text-align:center;
}

/* ---------------------------
   Grid
--------------------------- */

.grid-label{
  font-size:11px;
  letter-spacing:4px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:20px;
  animation:fadeUp 0.8s 0.1s ease both;
}

.birds-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
  gap:2px;
  animation:fadeUp 0.8s 0.2s ease both;
}

.bird-card{
  background:var(--card);
  border:1px solid var(--border);
  cursor:pointer;
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
  aspect-ratio:4/3;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.bird-card::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    var(
      --card-bg,
      linear-gradient(
        135deg,
        #1a2a1a,
        #0d1a0d
      )
    );
  transition:
    transform 0.6s
    cubic-bezier(0.4,0,0.2,1);
  z-index:0;
}

.bird-card:hover{
  border-color:rgba(255,255,255,0.15);
  transform:translateY(-2px);
}

.bird-card:hover::before{
  transform:scale(1.05);
}

.bird-card.playing{
  border-color:var(--accent);
  box-shadow:
    0 0 30px rgba(126,184,154,0.2),
    inset 0 0 30px rgba(126,184,154,0.05);
}

.bird-card.loading-sound{
  border-color:rgba(126,184,154,0.4);
}

.bird-photo-wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1;
  transition:transform 0.4s ease;
}

.bird-card:hover .bird-photo-wrap{
  transform:
    scale(1.1)
    translateY(-4px);
}

.bird-card.playing .bird-photo-wrap{
  animation:birdBob 1s ease-in-out infinite;
}

@keyframes birdBob{
  0%,100%{
    transform:
      translateY(0)
      scale(1.1);
  }

  50%{
    transform:
      translateY(-8px)
      scale(1.15);
  }
}

.bird-photo{
  width:96px;
  height:96px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,0.18);
  box-shadow:
    0 4px 20px rgba(0,0,0,0.5);
}

.bird-card.playing .bird-photo{
  border-color:var(--accent);
  box-shadow:
    0 0 20px rgba(126,184,154,0.4);
}

.bird-emoji-fallback{
  font-size:60px;
  filter:
    drop-shadow(
      0 4px 20px rgba(0,0,0,0.5)
    );
  line-height:1;
}

.habitat-tag{
  position:absolute;
  top:12px;
  right:12px;
  z-index:2;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.5);
  background:rgba(0,0,0,0.3);
  padding:4px 8px;
  border:1px solid rgba(255,255,255,0.1);
}

.bird-info{
  position:relative;
  z-index:2;
  padding:16px 20px 18px;
  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,0.7) 40%,
      rgba(0,0,0,0.9)
    );
}

.bird-common{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;
  font-weight:600;
  color:var(--text);
  line-height:1;
}

.bird-hindi{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:14px;
  color:rgba(255,255,255,0.5);
  margin-top:2px;
}

.bird-scientific{
  font-size:10px;
  letter-spacing:1px;
  color:rgba(255,255,255,0.3);
  margin-top:4px;
  font-style:italic;
}

.play-indicator{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  opacity:0;
  transform:translateY(4px);
  transition:all 0.2s ease;
}

.bird-card:hover .play-indicator,
.bird-card.playing .play-indicator,
.bird-card.loading-sound .play-indicator{
  opacity:1;
  transform:translateY(0);
}

.play-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent);
}

.bird-card.playing .play-dot{
  animation:pulseDot 1s ease infinite;
}

.bird-card.loading-sound .play-dot{
  animation:pulseDot 0.4s ease infinite;
  background:rgba(126,184,154,0.6);
}

@keyframes pulseDot{
  0%,100%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.4);
    opacity:0.6;
  }
}

.play-text{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--accent);
}

/* ---------------------------
   Footer
--------------------------- */

footer{
  margin-top:60px;
  text-align:center;
  padding-top:30px;
  border-top:1px solid var(--border);
  animation:fadeUp 0.8s 0.4s ease both;
}

.footer-text{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:14px;
  color:rgba(232,224,212,0.2);
  letter-spacing:1px;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(16px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ---------------------------
   Mobile
--------------------------- */

@media(max-width:600px){

  .ambience-panel{
    top:12px;
    right:12px;
    left:12px;
    padding:12px 14px 14px;
    border-radius:14px;
    gap:10px;
  }

  .panel-section{
    gap:6px;
  }

  .ambience-buttons{
    grid-template-columns:repeat(4,1fr);
    gap:6px;
  }

  .ambience-btn{
    flex-direction:column;
    padding:8px 4px;
    font-size:9px;
    gap:3px;
  }

  .ambience-btn .amb-icon{
    font-size:16px;
  }

  header{
    padding-top:200px;
  }

  .birds-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .bird-photo{
    width:64px;
    height:64px;
  }

  .bird-emoji-fallback{
    font-size:42px;
  }

  .bird-common{
    font-size:16px;
  }

  .bird-info{
    padding:12px 12px 14px;
  }

  .now-playing{
    padding:12px 16px;
  }

  .np-name{
    font-size:15px;
  }

  .featured-inner{
    flex-direction:column;
  }

  .featured-left{
    width:100%;
    flex-direction:row;
    flex-wrap:wrap;
    gap:16px;
    padding:16px 18px;
    border-right:none;
    border-bottom:1px solid var(--border);
  }

/* =========================================================
   TOGGLE AMBIENCE
========================================================= */

function toggleAmbient(id){

  const conf =
    ALL_SOUNDS.find(a => a.id === id);

  if(!conf) return;

  const btn =
    document.getElementById('amb-btn-' + id);

  const isOn =
    !!ambientOn[id];

  if(!isOn){

    if(!ambientAudios[id]){

      const audio =
        new Audio(conf.file);

      audio.loop = true;
      audio.volume = 0;

      audio.addEventListener('error', () => {

        alert(
          "Sorry, " +
          conf.label +
          " sound couldn't be loaded. Make sure " +
          conf.file +
          " exists."
        );

        audio.pause();

        delete ambientAudios[id];

        ambientOn[id] = false;

        btn.classList.remove('active');

        btn.setAttribute(
          'aria-pressed',
          'false'
        );

      });

      ambientAudios[id] = audio;
    }

    const audio =
      ambientAudios[id];

    audio.play().catch(() => {});

    fadeAudio(
      audio,
      audio.volume,
      conf.volume,
      800
    );

    ambientOn[id] = true;

    btn.classList.add('active');

    btn.setAttribute(
      'aria-pressed',
      'true'
    );

  }else{

    const audio =
      ambientAudios[id];

    fadeAudio(
      audio,
      audio.volume,
      0,
      600,
      () => audio.pause()
    );

    ambientOn[id] = false;

    btn.classList.remove('active');

    btn.setAttribute(
      'aria-pressed',
      'false'
    );

  }

}


/* =========================================================
   AUDIO FADE
========================================================= */

function fadeAudio(
  audio,
  from,
  to,
  duration,
  onDone
){

  if(audio._fadeInterval)
    clearInterval(audio._fadeInterval);

  const steps = 20;

  const stepTime =
    duration / steps;

  let i = 0;

  audio._fadeInterval =
    setInterval(() => {

      i++;

      audio.volume =
        Math.max(
          0,
          Math.min(
            1,
            from +
            (to - from) *
            (i / steps)
          )
        );

      if(i >= steps){

        clearInterval(
          audio._fadeInterval
        );

        audio._fadeInterval = null;

        if(onDone)
          onDone();
      }

    }, stepTime);
}

  const card =
    document.getElementById(
      'card-' + id
    );

  card.classList.add('loading-sound');

  document.getElementById(
    'playtxt-' + id
  ).textContent = 'Loading...';

  showFeatured(bird);

  updateBackground(bird);

  spawnRipple(card);

  document
    .querySelectorAll('.bird-silhouette')
    .forEach(s =>
      s.classList.add('active')
    );

  const audio =
    new Audio(bird.sound);

  audio.addEventListener(
    'canplaythrough',
    () => {

      currentAudio = audio;

      card.classList.remove(
        'loading-sound'
      );

      card.classList.add('playing');

      document.getElementById(
        'playtxt-' + id
      ).textContent =
        'Now playing...';

      document.getElementById(
        'npName'
      ).textContent =
        bird.common;

      document.getElementById(
        'npSub'
      ).textContent =
        bird.hindi +
        ' · ' +
        bird.habitat;

      document.getElementById(
        'nowPlaying'
      ).classList.add('visible');

      audio.play().catch(() => {});

    },
    { once:true }
  );

  audio.addEventListener(
    'ended',
    () => stopAll()
  );

  audio.addEventListener(
    'error',
    () => {

      card.classList.remove(
        'loading-sound'
      );

      alert(
        "Sorry, sound failed to load for " +
        bird.common
      );

    }
  );

}


/* =========================================================
   STOP EVERYTHING
========================================================= */

function stopAll(){

  /* Stop Talking Tota */

  if(
    totaRecognition &&
    totaListening
  ){
    try{
      totaRecognition.stop();
    }catch(e){}
  }

  totaListening = false;

  if(
    'speechSynthesis' in window
  ){
    window.speechSynthesis.cancel();
  }

  /* Stop bird */

  if(currentAudio){

    currentAudio.pause();

    currentAudio.currentTime = 0;

    currentAudio = null;
  }

  currentBirdId = null;

  document
    .querySelectorAll('.bird-card')
    .forEach(c =>
      c.classList.remove(
        'playing',
        'loading-sound'
      )
    );

  document
    .querySelectorAll('[id^="playtxt-"]')
    .forEach(t =>
      t.textContent = 'Tap to play'
    );

  document
    .getElementById('nowPlaying')
    .classList.remove('visible');

  document
    .getElementById('featuredPanel')
    .classList.remove('visible');

  document
    .getElementById('totaTalkArea')
    .classList.remove('visible');

  document
    .querySelectorAll('.bird-silhouette')
    .forEach(s =>
      s.classList.remove('active')
    );

  document
    .getElementById('bgActive')
    .style.opacity = '0';

}


/* =========================================================
   BACKGROUND
========================================================= */

function updateBackground(bird){

  const bg =
    document.getElementById('bgActive');

  bg.style.background =
    `${bird.bg},
     radial-gradient(
       ellipse at 30% 40%,
       ${bird.bgGlow} 0%,
       transparent 55%
     )`;

  bg.style.opacity = '1';

  spawnParticles(
    bird.particleColor
  );
}


/* =========================================================
   PARTICLES
========================================================= */

function spawnParticles(color){

  const c =
    document.getElementById('particles');

  c.innerHTML = '';

  for(
    let i = 0;
    i < 18;
    i++
  ){

    const p =
      document.createElement('div');

    p.className = 'particle';

    const s =
      Math.random() * 4 + 2;

    p.style.cssText =
      `width:${s}px;
       height:${s}px;
       left:${Math.random()*100}%;
       background:${color};
       --drift:${(Math.random()-0.5)*200}px;
       animation-duration:${Math.random()*8+6}s;
       animation-delay:${Math.random()*4}s;`;

    c.appendChild(p);
  }

}


/* =========================================================
   RIPPLE
========================================================= */

function spawnRipple(card){

  const c =
    document.getElementById(
      'rippleContainer'
    );

  const r =
    card.getBoundingClientRect();

  for(
    let i = 0;
    i < 3;
    i++
  ){

    setTimeout(() => {

      const el =
        document.createElement('div');

      el.className = 'ripple';

      el.style.left =
        (r.left + r.width / 2) +
        'px';

      el.style.top =
        (r.top + r.height / 2) +
        'px';

      el.style.animationDelay =
        (i * 0.4) + 's';

      c.appendChild(el);

      setTimeout(
        () => el.remove(),
        3500
      );

    }, i * 300);

  }

}


/* =========================================================
   FEATURED BIRD
========================================================= */

function showFeatured(bird){

  const panel =
    document.getElementById(
      'featuredPanel'
    );

  panel.classList.remove('visible');

  setTimeout(() => {

    const fallback =
      document.getElementById(
        'featuredEmojiFallback'
      );

    fallback.textContent =
      bird.emoji;

    document.getElementById(
      'featuredName'
    ).textContent =
      bird.common;

    document.getElementById(
      'featuredHindi'
    ).textContent =
      bird.hindi;

    document.getElementById(
      'featuredHabitat'
    ).textContent =
      bird.habitat;

    document.getElementById(
      'featuredFact'
    ).textContent =
      bird.fact;

    document.getElementById(
      'featuredScientific'
    ).textContent =
      bird.scientific;

    /* --------------------------------
       Talking Tota
    -------------------------------- */

    const totaArea =
      document.getElementById(
        'totaTalkArea'
      );

    const totaBtn =
      document.getElementById(
        'totaTalkBtn'
      );

    const totaStatus =
      document.getElementById(
        'totaTalkStatus'
      );

    if(bird.id === 'parakeet'){

      totaArea.classList.add('visible');

      if(totaBtn){

        totaBtn.classList.remove(
          'listening'
        );

        totaBtn.innerHTML =
          '🦜 Talk to Tota';

      }

      if(totaStatus){

        totaStatus.textContent =
          'Say something and Tota will repeat it.';

      }

    }else{

      totaArea.classList.remove(
        'visible'
      );

    }

    panel.classList.add('visible');

  }, 80);

}


/* =========================================================
   TALKING TOTA
========================================================= */

function setupTotaRecognition(){

  if(!SpeechRecognition)
    return null;

  const recognition =
    new SpeechRecognition();

  /*
   * Indian English gives better recognition
   * for many Indian English speakers.
   */
  recognition.lang = 'en-IN';

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;


  recognition.onstart = () => {

    totaListening = true;

    const btn =
      document.getElementById(
        'totaTalkBtn'
      );

    const status =
      document.getElementById(
        'totaTalkStatus'
      );

    if(btn){

      btn.classList.add(
        'listening'
      );

      btn.innerHTML =
        '🎙️ Listening...';

    }

    if(status){

      status.textContent =
        'Tota is listening... say something!';

    }

  };


  recognition.onresult = event => {

    const transcript =
      event.results[0][0]
        .transcript
        .trim();

    if(transcript){

      repeatLikeTota(
        transcript
      );

    }

  };


  recognition.onerror = event => {

    totaListening = false;

    const btn =
      document.getElementById(
        'totaTalkBtn'
      );

    const status =
      document.getElementById(
        'totaTalkStatus'
      );

    if(btn){

      btn.classList.remove(
        'listening'
      );

      btn.innerHTML =
        '🦜 Talk to Tota';

    }

    if(status){

      if(
        event.error ===
        'not-allowed'
      ){

        status.textContent =
          'Microphone permission is needed for Tota to listen.';

      }else if(
        event.error ===
        'no-speech'
      ){

        status.textContent =
          'Tota did not hear anything. Try again!';

      }else{

        status.textContent =
          'Tota had trouble listening. Please try again.';

      }

    }

  };


  recognition.onend = () => {

    totaListening = false;

    const btn =
      document.getElementById(
        'totaTalkBtn'
      );

    if(btn){

      btn.classList.remove(
        'listening'
      );

      btn.innerHTML =
        '🦜 Talk to Tota';

    }

  };


  return recognition;

}


/* =========================================================
   START TALKING TOTA
========================================================= */

function talkToTota(){

  if(!SpeechRecognition){

    const status =
      document.getElementById(
        'totaTalkStatus'
      );

    if(status){

      status.textContent =
        'Talking Tota is not supported in this browser. Try Chrome or Edge.';

    }

    return;
  }


  if(
    totaListening &&
    totaRecognition
  ){

    try{
      totaRecognition.stop();
    }catch(e){}

    return;
  }


  if(
    'speechSynthesis' in window
  ){

    window.speechSynthesis.cancel();

  }


  totaRecognition =
    setupTotaRecognition();


  if(!totaRecognition)
    return;


  try{

    totaRecognition.start();

  }catch(error){

    console.log(
      'Tota recognition error:',
      error
    );

  }

}


/* =========================================================
   PROCESS TOTA REPEAT
========================================================= */

function repeatLikeTota(text){

  const status =
    document.getElementById(
      'totaTalkStatus'
    );

  /*
   * Remove punctuation.
   */
  let phrase =
    text
      .replace(/[!?.,]+/g,' ')
      .replace(/\s+/g,' ')
      .trim();


  if(!phrase)
    return;


  /*
   * A real parrot usually picks up
   * short words and phrases.
   *
   * So we intentionally keep
   * the first few words.
   */
  const words =
    phrase.split(' ');


  const maxWords = 7;


  if(words.length > maxWords){

    phrase =
      words
        .slice(0,maxWords)
        .join(' ');

  }


  if(status){

    status.textContent =
      `Tota says: "${phrase}"`;

  }


  /*
   * Small pause makes the interaction
   * feel more natural.
   */
  setTimeout(() => {

    speakLikeTota(
      phrase
    );

  },350);

}


/* =========================================================
   SPEAK LIKE A PLAYFUL PARROT
========================================================= */

function speakLikeTota(text){

  if(
    !('speechSynthesis' in window)
  ){

    const status =
      document.getElementById(
        'totaTalkStatus'
      );

    if(status){

      status.textContent =
        'Your browser cannot make Tota speak.';

    }

    return;
  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  /*
   * Higher pitch + slightly faster rate
   * gives the browser voice a more playful
   * parrot-like sound.
   */
  utterance.rate = 1.12;

  utterance.pitch = 1.55;

  utterance.volume = 1;


  /*
   * Prefer Indian English voice.
   */
  const voices =
    window.speechSynthesis
      .getVoices();


  const indianVoice =
    voices.find(
      v => /en-IN/i.test(v.lang)
    );


  const englishVoice =
    voices.find(
      v => /^en/i.test(v.lang)
    );


  if(indianVoice){

    utterance.voice =
      indianVoice;

  }else if(englishVoice){

    utterance.voice =
      englishVoice;

  }


  utterance.onstart = () => {

    const status =
      document.getElementById(
        'totaTalkStatus'
      );

    if(status){

      status.textContent =
        '🦜 Tota is repeating you...';

    }

  };


  utterance.onend = () => {

    const status =
      document.getElementById(
        'totaTalkStatus'
      );

    if(status){

      status.textContent =
        'Say something else and Tota will repeat it.';

    }

  };


  window.speechSynthesis.speak(
    utterance
  );

}

renderGrid();

renderAmbience();
